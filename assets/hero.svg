<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">gemini_skills - Autonomous AI Agent Skills</title>
  <desc id="desc">Production-ready agent skills for Gemini CLI, Antigravity, and coding LLMs.</desc>

  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="50%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Gemini Brand Gradient -->
    <linearGradient id="geminiGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#162032" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E1E38" />
      <stop offset="100%" stop-color="#111322" />
    </linearGradient>

    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14242C" />
      <stop offset="100%" stop-color="#0D1A1F" />
    </linearGradient>

    <!-- Glow filters -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.4" />
    </pattern>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="440" rx="20" fill="url(#bgGradient)" stroke="#1E293B" stroke-width="1.5" />
  <rect width="1200" height="440" rx="20" fill="url(#grid)" />

  <!-- Ambient Glow Behind Right Cards -->
  <circle cx="880" cy="200" r="160" fill="#38BDF8" opacity="0.08" filter="url(#subtleGlow)" />
  <circle cx="1060" cy="280" r="140" fill="#818CF8" opacity="0.08" filter="url(#subtleGlow)" />

  <!-- ================= LEFT COLUMN: HERO IDENTITY ================= -->
  <g transform="translate(60, 50)">
    <!-- Pill Badge -->
    <rect width="280" height="28" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <circle cx="14" cy="14" r="5" fill="#38BDF8" />
    <text x="28" y="18" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="1">
      GEMINI &amp; AGENT CAPABILITIES
    </text>

    <!-- Main Title -->
    <text x="0" y="85" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="800" letter-spacing="-1">
      gemini<tspan fill="url(#geminiGrad)">_skills</tspan>
    </text>

    <!-- Subtitle / Value Prop -->
    <text x="0" y="130" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400">
      Production-grade autonomous agent skills engineered for
    </text>
    <text x="0" y="156" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500">
      Gemini CLI, Google Antigravity, and Agentic Coding Runtimes.
    </text>

    <!-- Key Metadata Tags Grid -->
    <g transform="translate(0, 200)">
      <!-- Row 1 -->
      <g transform="translate(0, 0)">
        <rect width="150" height="32" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1" />
        <text x="14" y="20" fill="#38BDF8" font-family="monospace" font-size="12" font-weight="600">⚡ Token-Efficient</text>
      </g>
      <g transform="translate(160, 0)">
        <rect width="165" height="32" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1" />
        <text x="14" y="20" fill="#818CF8" font-family="monospace" font-size="12" font-weight="600">📄 PDF Spec Engine</text>
      </g>
      <!-- Row 2 -->
      <g transform="translate(0, 42)">
        <rect width="175" height="32" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1" />
        <text x="14" y="20" fill="#C084FC" font-family="monospace" font-size="12" font-weight="600">📝 MD Guide Engine</text>
      </g>
      <g transform="translate(185, 42)">
        <rect width="160" height="32" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1" />
        <text x="14" y="20" fill="#34D399" font-family="monospace" font-size="12" font-weight="600">📊 Matrix Archetypes</text>
      </g>
    </g>

    <!-- Compatibility Footnote -->
    <g transform="translate(0, 310)">
      <circle cx="6" cy="6" r="3" fill="#10B981" />
      <text x="18" y="10" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">
        Tested on Antigravity Agent • Gemini CLI • Claude Code • Open Public Repo
      </text>
    </g>
  </g>

  <!-- ================= RIGHT COLUMN: INTERACTIVE VISUAL CARDS ================= -->

  <!-- Skill Card 1: pdf-agentic-guide-creator -->
  <g transform="translate(630, 32)">
    <rect width="520" height="115" rx="12" fill="url(#cardGrad1)" stroke="#334155" stroke-width="1.2" />
    <rect width="520" height="28" rx="12" fill="#1E293B" />
    <path d="M 0 16 Q 0 28 12 28 L 508 28 Q 520 28 520 16 Z" fill="#1E293B" />
    <circle cx="16" cy="14" r="4" fill="#EF4444" />
    <circle cx="28" cy="14" r="4" fill="#F59E0B" />
    <circle cx="40" cy="14" r="4" fill="#10B981" />
    <text x="60" y="18" fill="#E2E8F0" font-family="monospace" font-size="11" font-weight="700">skill: pdf-agentic-guide-creator</text>
    <rect x="420" y="6" width="88" height="16" rx="5" fill="#0369A1" />
    <text x="428" y="18" fill="#E0F2FE" font-family="monospace" font-size="9" font-weight="700">-85% TOKENS</text>

    <text x="18" y="48" fill="#94A3B8" font-family="monospace" font-size="10.5">
      <tspan fill="#38BDF8">Engine:</tspan> ReportLab Platypus splittable flowables (no KeepTogether clipping)
    </text>
    <text x="18" y="68" fill="#94A3B8" font-family="monospace" font-size="10.5">
      <tspan fill="#818CF8">Syntax:</tspan> <tspan fill="#F1F5F9">=== BEGIN FILE: &lt;path&gt; ===</tspan> with 92-char wrap
    </text>
    <text x="18" y="88" fill="#94A3B8" font-family="monospace" font-size="10.5">
      <tspan fill="#34D399">Gate:</tspan> Automated sentinel assertion: assert "=== END OF SPECIFICATION ==="
    </text>
  </g>

  <!-- Skill Card 2: markdown-agentic-guide-creator -->
  <g transform="translate(630, 160)">
    <rect width="520" height="115" rx="12" fill="url(#cardGrad2)" stroke="#4338CA" stroke-width="1.2" />
    <rect width="520" height="28" rx="12" fill="#2E1065" />
    <path d="M 0 16 Q 0 28 12 28 L 508 28 Q 520 28 520 16 Z" fill="#2E1065" />
    <circle cx="16" cy="14" r="4" fill="#EF4444" />
    <circle cx="28" cy="14" r="4" fill="#F59E0B" />
    <circle cx="40" cy="14" r="4" fill="#10B981" />
    <text x="60" y="18" fill="#E2E8F0" font-family="monospace" font-size="11" font-weight="700">skill: markdown-agentic-guide-creator</text>
    <rect x="420" y="6" width="88" height="16" rx="5" fill="#6D28D9" />
    <text x="427" y="18" fill="#EDE9FE" font-family="monospace" font-size="9" font-weight="700">MD SPEC + CLI</text>

    <text x="18" y="48" fill="#94A3B8" font-family="monospace" font-size="10.5">
      <tspan fill="#A78BFA">Format:</tspan> Quadruple backticks (````) protect nested code fences from breaking
    </text>
    <text x="18" y="68" fill="#94A3B8" font-family="monospace" font-size="10.5">
      <tspan fill="#C084FC">Tooling:</tspan> Includes build_agent_spec_md.py and unpack_agent_spec.py
    </text>
    <text x="18" y="88" fill="#94A3B8" font-family="monospace" font-size="10.5">
      <tspan fill="#34D399">Delivery:</tspan> Writes directly to disk; zero conversational chat token spillage
    </text>
  </g>

  <!-- Skill Card 3: table-summarizer -->
  <g transform="translate(630, 288)">
    <rect width="520" height="115" rx="12" fill="url(#cardGrad3)" stroke="#0D9488" stroke-width="1.2" />
    <rect width="520" height="28" rx="12" fill="#134E4A" />
    <path d="M 0 16 Q 0 28 12 28 L 508 28 Q 520 28 520 16 Z" fill="#134E4A" />
    <circle cx="16" cy="14" r="4" fill="#EF4444" />
    <circle cx="28" cy="14" r="4" fill="#F59E0B" />
    <circle cx="40" cy="14" r="4" fill="#10B981" />
    <text x="60" y="18" fill="#E2E8F0" font-family="monospace" font-size="11" font-weight="700">skill: table-summarizer</text>
    <rect x="420" y="6" width="88" height="16" rx="5" fill="#047857" />
    <text x="428" y="18" fill="#D1FAE5" font-family="monospace" font-size="9" font-weight="700">5 ARCHETYPES</text>

    <text x="18" y="48" fill="#94A3B8" font-family="monospace" font-size="10.5">
      <tspan fill="#2DD4BF">Archetypes:</tspan> Action Items • Comparative • Milestones • Trade-offs • Synthesis
    </text>
    <text x="18" y="68" fill="#94A3B8" font-family="monospace" font-size="10.5">
      <tspan fill="#34D399">Standard:</tspan> Lead with 1-2 sentence context; bold anchors; zero text bloat
    </text>
    <text x="18" y="88" fill="#94A3B8" font-family="monospace" font-size="10.5">
      <tspan fill="#86EFAC">Output:</tspan> Turns multi-page unstructured text into tight, decision-ready matrices
    </text>
  </g>
</svg>
